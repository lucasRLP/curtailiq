    <!-- Theme -->
    <meta name="theme-color" content="#0b1119" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Aplica o tema antes da primeira pintura. Sem isto a página nasce clara e
      pisca em branco até o React montar o ThemeProvider — o pior defeito
      visível de um app que abre escuro por padrão.
    -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem("theme")
          var tema = salvo === "light" || salvo === "dark" ? salvo : null
          if (!tema && salvo === "system") {
            tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          }
          document.documentElement.classList.add(tema || "dark")
        } catch (e) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
    <style>
      /* Cor de fundo já no HTML, para o flash não acontecer nem antes do CSS. */
      html { background: #0b1119; }
      html.light { background: #f6f8f9; }
    </style>
