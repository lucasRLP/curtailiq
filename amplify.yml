version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm -v
        - cd front && npm ci
    build:
      commands:
        - cd front && npm run build
  artifacts:
    baseDirectory: front/dist
    files:
      - "**/*"
  cache:
    paths:
      - front/node_modules/**/*
